<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Ministério Pessoal — IASD Nova Brasília</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root{
      --bg:#F2F4F8;
      --surface:#FFFFFF;
      --ink:#141C2C;
      --ink-soft:#64748B;
      --teal:#0F4C86;
      --teal-dark:#053067;
      --teal-tint:#E7EEF7;
      --gold:#B8862A;
      --gold-tint:#F8EFDC;
      --terracotta:#C8102E;
      --terracotta-tint:#FBE7EA;
      --border:#E1E6EF;
      --radius:10px;
      --shadow:0 1px 2px rgba(5,48,103,.08);
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body{ margin:0; padding:0; background:var(--bg); }
    body{ font-family:'Inter',sans-serif; color:var(--ink); font-size:13.5px; }
    h1,h2,h3,h4{ font-family:'Poppins',sans-serif; font-weight:600; margin:0; color:var(--teal-dark); }
    p{ margin:0; }
    button{ font-family:'Inter',sans-serif; cursor:pointer; border:none; background:none; }
    input,select,textarea{ font-family:'Inter',sans-serif; }
    svg{ display:block; }
    #app{ min-height:100vh; }

    /* ---------- Topbar ---------- */
    .topbar{
      background:var(--teal-dark); color:#fff; padding:11px 14px;
      position:sticky; top:0; z-index:20;
      display:flex; align-items:center; gap:10px;
    }
    .hamburger{
      width:36px; height:36px; border-radius:8px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center; color:#fff;
    }
    .hamburger:active{ background:rgba(255,255,255,.1); }
    .brand-compact{ display:flex; align-items:center; gap:9px; cursor:pointer; flex:1; min-width:0; }
    .brand-mark{
      width:28px; height:28px; border-radius:7px; flex-shrink:0; background:var(--gold);
      display:flex; align-items:center; justify-content:center;
      font-family:'Poppins',sans-serif; font-weight:700; color:var(--teal-dark); font-size:12px;
    }
    .brand-compact h1{ color:#fff; font-size:14.5px; font-weight:600; letter-spacing:.1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .current-profile{ font-size:11px; color:#A9C2DC; white-space:nowrap; flex-shrink:0; }

    /* ---------- Drawer ---------- */
    .drawer-overlay{ position:fixed; inset:0; background:rgba(5,48,103,.4); z-index:29; }
    .drawer{
      position:fixed; top:0; left:0; bottom:0; width:270px; max-width:82vw; background:var(--surface);
      z-index:30; box-shadow:2px 0 20px rgba(0,0,0,.15); display:flex; flex-direction:column;
      animation:slidein-left .17s ease;
    }
    @keyframes slidein-left{ from{ transform:translateX(-100%);} to{ transform:translateX(0);} }
    .drawer-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border); }
    .drawer-head span{ font-family:'Poppins',sans-serif; font-weight:600; font-size:14.5px; color:var(--teal-dark); }
    .drawer-close{ width:30px; height:30px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); border-radius:7px; }
    .drawer-close:active{ background:var(--teal-tint); }
    .drawer-items{ padding:8px; flex:1; overflow-y:auto; }
    .drawer-item{
      width:100%; display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:8px;
      font-size:13.5px; font-weight:600; color:var(--ink); text-align:left; margin-bottom:2px;
    }
    .drawer-item svg{ color:var(--ink-soft); flex-shrink:0; }
    .drawer-item:active{ background:var(--teal-tint); }
    .drawer-item.active{ background:var(--teal-tint); color:var(--teal-dark); }
    .drawer-item.active svg{ color:var(--teal); }
    .drawer-sep{ height:1px; background:var(--border); margin:8px 12px; }
    .drawer-foot{ padding:12px 16px; font-size:10.5px; color:var(--ink-soft); border-top:1px solid var(--border); }

    main{ padding:18px 16px 56px; max-width:1040px; margin:0 auto; }

    /* ---------- Area chooser / auth ---------- */
    .area-screen{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:26px; }
    .area-brand{ display:flex; align-items:center; gap:10px; }
    .area-brand .brand-mark{ width:42px; height:42px; border-radius:11px; font-size:17px; }
    .area-brand h1{ font-size:18px; }
    .area-cards{ display:flex; flex-direction:column; gap:12px; width:100%; max-width:340px; }
    .area-card{
      background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px;
      display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center; box-shadow:var(--shadow);
    }
    .area-card:active{ background:var(--teal-tint); }
    .area-card .ic{ width:38px; height:38px; border-radius:10px; background:var(--teal-tint); color:var(--teal); display:flex; align-items:center; justify-content:center; }
    .area-card h3{ font-size:14.5px; }
    .area-card span{ font-size:11px; color:var(--ink-soft); }

    .auth-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .auth-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:26px 24px; width:100%; max-width:340px; box-shadow:var(--shadow); }
    .auth-card h2{ font-size:16.5px; margin-bottom:14px; text-align:center; }

    /* ---------- Home ---------- */
    .hero{ margin-bottom:16px; }
    .hero h2{ font-size:19px; }

    .pipeline{ display:flex; align-items:flex-start; gap:0; margin:16px 0 22px; overflow-x:auto; padding:2px 2px 4px; }
    .pl-node{ display:flex; flex-direction:column; align-items:center; gap:6px; min-width:92px; flex-shrink:0; }
    .pl-circle{ width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; }
    .pl-label{ font-size:10.5px; font-weight:600; text-align:center; line-height:1.2; color:var(--ink); }
    .pl-count{ font-size:11px; font-weight:700; color:var(--ink-soft); }
    .pl-line{ height:1px; flex:1; min-width:20px; background:var(--border); margin-top:19px; }

    .stats-strip{
      display:grid; grid-template-columns:repeat(auto-fit,minmax(108px,1fr)); gap:1px;
      background:var(--border); border:1px solid var(--border); border-radius:var(--radius);
      overflow:hidden; margin-bottom:20px;
    }
    .stats-strip .item{ background:var(--surface); padding:11px 13px; }
    .stats-strip .n{ font-family:'Poppins',sans-serif; font-size:19px; font-weight:700; color:var(--teal-dark); line-height:1.1; }
    .stats-strip .l{ font-size:10.5px; color:var(--ink-soft); margin-top:2px; }

    .quick-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; }
    .quick-card{
      background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px;
      display:flex; align-items:center; gap:10px; cursor:pointer; text-align:left;
    }
    .quick-card:active{ background:var(--teal-tint); }
    .quick-card .ic{ width:34px; height:34px; border-radius:8px; background:var(--teal-tint); color:var(--teal); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .quick-card h3{ font-size:12.5px; font-weight:600; color:var(--ink); line-height:1.25; }

    /* ---------- Section shell ---------- */
    .section-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
    .section-head h2{ font-size:16.5px; }

    .tabs{ display:flex; gap:2px; overflow-x:auto; -ms-overflow-style:none; scrollbar-width:none; border-bottom:1px solid var(--border); margin-bottom:16px; }
    .tabs::-webkit-scrollbar{ display:none; }
    .tab{ padding:8px 12px; font-size:12px; font-weight:600; color:var(--ink-soft); border-bottom:2px solid transparent; white-space:nowrap; flex-shrink:0; }
    .tab.active{ color:var(--teal); border-color:var(--teal); }

    .btn{ min-height:36px; padding:0 13px; border-radius:8px; font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
    .btn-primary{ background:var(--teal); color:#fff; }
    .btn-primary:active{ background:var(--teal-dark); }
    .btn-ghost{ background:transparent; color:var(--teal); border:1px solid var(--border); }
    .btn-danger-ghost{ background:transparent; color:var(--terracotta); border:1px solid var(--border); }
    .btn-sm{ min-height:30px; padding:0 10px; font-size:11.5px; border-radius:6px; }
    .btn-full{ width:100%; }
    .btn[disabled]{ opacity:.5; pointer-events:none; }

    .card-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); }
    .card h3{ font-size:14px; margin-bottom:3px; }
    .card .meta{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
    .card-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:11px; padding-top:10px; border-top:1px solid var(--border); flex-wrap:wrap; gap:7px; }
    .count-pill{ font-size:10.5px; font-weight:700; background:var(--teal-tint); color:var(--teal-dark); padding:3px 8px; border-radius:999px; }
    .card-actions{ display:flex; gap:3px; }

    .empty{ text-align:center; padding:34px 16px; color:var(--ink-soft); background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius); }
    .empty .ic{ width:36px; height:36px; margin:0 auto 8px; color:var(--ink-soft); }
    .empty h4{ color:var(--ink); font-size:13px; font-weight:600; font-family:'Inter',sans-serif; }

    table{ width:100%; border-collapse:collapse; background:var(--surface); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
    thead th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); background:var(--teal-tint); padding:9px 12px; }
    tbody td{ padding:10px 12px; font-size:12.5px; border-top:1px solid var(--border); }

    .badge{ font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px; display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
    .badge-baptized{ background:var(--gold-tint); color:#7A5A12; }
    .badge-interest{ background:var(--terracotta-tint); color:var(--terracotta); }
    .badge-neutral{ background:var(--teal-tint); color:var(--teal-dark); }
    .badge-lock-ok{ background:var(--teal-tint); color:var(--teal-dark); }
    .badge-lock-warn{ background:var(--terracotta-tint); color:var(--terracotta); }

    .row-actions{ display:flex; gap:3px; justify-content:flex-end; flex-wrap:wrap; }
    .icon-btn{ color:var(--ink-soft); padding:6px 8px; border-radius:6px; font-size:11.5px; min-height:30px; }
    .icon-btn:active{ background:var(--teal-tint); color:var(--teal-dark); }

    select.inline-select{ padding:6px 7px; border-radius:6px; border:1px solid var(--border); font-size:11.5px; max-width:100%; }

    .field{ margin-bottom:11px; }
    .field label{ display:block; font-size:11px; font-weight:600; color:var(--ink-soft); margin-bottom:4px; }
    .field input[type=text], .field input[type=tel], .field input[type=password], .field input[type=date], .field select, .field textarea{
      width:100%; padding:10px 11px; border:1px solid var(--border); border-radius:8px; font-size:13.5px; color:var(--ink); background:#FBFCFD;
    }
    .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--teal); outline-offset:1px; }
    .field textarea{ resize:vertical; min-height:56px; }
    .field .hint{ display:block; font-size:10.5px; font-weight:400; color:var(--ink-soft); margin-top:4px; }
    .checkline{ display:flex; align-items:center; gap:9px; background:var(--teal-tint); padding:10px 12px; border-radius:8px; }
    .checkline input{ width:16px; height:16px; flex-shrink:0; }
    .checkline label{ font-size:12.5px; font-weight:600; color:var(--teal-dark); margin:0; }
    .modal-sub-label{ font-size:11px; font-weight:700; color:var(--ink-soft); letter-spacing:.02em; }

    /* ---------- Mapas (Leaflet) ---------- */
    .map-box{
      height:260px; border-radius:var(--radius); overflow:hidden; border:1px solid var(--border); background:var(--teal-tint);
      position:relative; isolation:isolate; z-index:0;
    }
    .map-help{ font-size:11px; color:var(--ink-soft); margin:6px 0 10px; }
    .leaflet-popup-content{ font-family:'Inter',sans-serif; font-size:12px; }

    /* ---------- Tabela de frequência (chamada) ---------- */
    .freq-table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:10px; border-radius:var(--radius); }
    .freq-table{ border-collapse:collapse; background:var(--surface); box-shadow:var(--shadow); min-width:100%; }
    .freq-table th, .freq-table td{ padding:8px 10px; font-size:12px; border-top:1px solid var(--border); white-space:nowrap; text-align:center; }
    .freq-table thead th{ background:var(--teal-tint); color:var(--ink-soft); font-size:10.5px; text-transform:uppercase; letter-spacing:.02em; cursor:pointer; }
    .freq-table thead th:hover{ color:var(--teal-dark); }
    .freq-table td:first-child, .freq-table th:first-child{
      text-align:left; position:sticky; left:0; background:var(--surface); font-weight:600; z-index:1;
    }
    .freq-table thead th:first-child{ background:var(--teal-tint); cursor:default; }
    .freq-present{ color:var(--teal); }
    .freq-absent{ color:var(--ink-soft); opacity:.4; }
    .freq-table, .freq-table thead, .freq-table tbody, .freq-table tr, .freq-table td, .freq-table th{
      display:revert !important;
    }
    .freq-table td::before{ content:none !important; }

    /* Ícone de "observação" no cabeçalho de cada data — só aparece quando
       o encontro tem `observacoes` preenchidas. Clicável, sem interferir no
       clique da própria data (que abre a chamada). */
    .freq-th-inner{ display:inline-flex; align-items:center; justify-content:center; gap:3px; }
    .freq-th-date{ cursor:pointer; }
    .obs-icon-btn{
      display:inline-flex; align-items:center; justify-content:center;
      width:18px; height:18px; border-radius:5px; color:var(--gold); flex-shrink:0;
    }
    .obs-icon-btn:active{ background:var(--gold-tint); }

    @media (max-width:680px){
      table, thead, tbody, tr, td{ display:block; width:100%; }
      table{ box-shadow:none; background:transparent; border-radius:0; }
      thead{ display:none; }
      tr{ background:var(--surface); border:1px solid var(--border); border-radius:10px; margin-bottom:8px; padding:2px 0; box-shadow:var(--shadow); }
      td{ border-top:none; padding:7px 13px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
      td::before{ content:attr(data-label); font-weight:600; color:var(--ink-soft); font-size:10px; text-transform:uppercase; letter-spacing:.03em; flex-shrink:0; }
      td:last-child{ justify-content:flex-end; }
      td:last-child::before{ content:''; }
    }

    /* ---------- Modal ---------- */
    .overlay{ position:fixed; inset:0; background:rgba(5,48,103,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:14px; }
    .modal{ background:var(--surface); border-radius:14px; padding:18px; width:100%; max-width:400px; max-height:88vh; overflow-y:auto; box-shadow:0 12px 40px rgba(0,0,0,.22); }
    .modal h3{ font-size:15px; margin-bottom:12px; }
    .modal-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }

    @media (max-width:640px){
      .overlay{ align-items:flex-end; padding:0; }
      .modal{ max-width:100%; border-radius:16px 16px 0 0; max-height:85vh; animation:sheetup .2s ease; }
      .modal-actions{ flex-direction:column-reverse; }
      .modal-actions .btn{ width:100%; }
      .drawer{ width:250px; }
    }
    @keyframes sheetup{ from{ transform:translateY(100%);} to{ transform:translateY(0);} }

    /* ---------- Toast ---------- */
    .toast-wrap{ position:fixed; bottom:14px; right:14px; left:14px; display:flex; flex-direction:column; align-items:flex-end; gap:7px; z-index:99; pointer-events:none; }
    .toast{ background:var(--teal-dark); color:#fff; padding:10px 14px; border-radius:8px; font-size:12px; box-shadow:0 6px 20px rgba(0,0,0,.2); animation:slidein .2s ease; max-width:300px; }
    .toast.err{ background:var(--terracotta); }
    @keyframes slidein{ from{ transform:translateY(8px); opacity:0;} to{ transform:translateY(0); opacity:1;} }

    .loading-screen{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:80px 20px; color:var(--ink-soft); gap:10px; }
    .spinner{ width:22px; height:22px; border:3px solid var(--border); border-top-color:var(--teal); border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin{ to{ transform:rotate(360deg); } }

    .notice{ background:var(--gold-tint); color:#7A5A12; font-size:11.5px; padding:9px 12px; border-radius:8px; margin-bottom:14px; }

    /* ---------- Notificações (só coordenador) ---------- */
    .notif-bell{ position:relative; width:36px; height:36px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; }
    .notif-bell:active{ background:rgba(255,255,255,.1); }
    .notif-badge{
      position:absolute; top:1px; right:1px; background:var(--terracotta); color:#fff; font-size:9.5px; font-weight:700;
      min-width:15px; height:15px; border-radius:999px; display:flex; align-items:center; justify-content:center; padding:0 3px; line-height:1;
    }
    .notif-panel{
      position:fixed; top:58px; right:10px; width:310px; max-width:88vw; max-height:70vh; overflow-y:auto;
      background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:0 14px 36px rgba(0,0,0,.2); z-index:65;
    }
    .notif-panel-head{ padding:11px 14px; font-weight:700; font-size:12.5px; color:var(--teal-dark); border-bottom:1px solid var(--border); font-family:'Poppins',sans-serif; }
    .notif-item{ padding:11px 14px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:6px; }
    .notif-item:last-child{ border-bottom:none; }
    .notif-msg{ font-size:12px; line-height:1.4; color:var(--ink); }
    .notif-tag{ font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
    .notif-tag.novo_interessado{ color:var(--terracotta); }
    .notif-tag.estudo_interrompido{ color:var(--gold); }
    .notif-empty{ padding:22px 14px; text-align:center; font-size:12px; color:var(--ink-soft); }

    /* ---------- Assistente de IA (chat flutuante, só coordenador) ---------- */
    .ai-fab{
      position:fixed; bottom:16px; right:16px; width:52px; height:52px; border-radius:50%; background:var(--teal); color:#fff;
      display:flex; align-items:center; justify-content:center; box-shadow:0 8px 22px rgba(5,48,103,.35); z-index:65;
    }
    .ai-fab:active{ background:var(--teal-dark); }
    .ai-chat{
      position:fixed; bottom:78px; right:16px; width:325px; max-width:92vw; height:430px; max-height:72vh;
      background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:0 16px 44px rgba(0,0,0,.22);
      z-index:65; display:flex; flex-direction:column; overflow:hidden;
    }
    .ai-chat-head{ background:var(--teal-dark); color:#fff; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; font-size:12.5px; font-weight:700; font-family:'Poppins',sans-serif; }
    .ai-chat-close{ color:#fff; width:24px; height:24px; display:flex; align-items:center; justify-content:center; border-radius:6px; flex-shrink:0; }
    .ai-chat-close:active{ background:rgba(255,255,255,.15); }
    .ai-chat-body{ flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
    .ai-msg{ max-width:85%; padding:8px 11px; border-radius:12px; font-size:12px; line-height:1.45; white-space:pre-wrap; }
    .ai-msg.user{ align-self:flex-end; background:var(--teal); color:#fff; border-bottom-right-radius:3px; }
    .ai-msg.bot{ align-self:flex-start; background:var(--teal-tint); color:var(--ink); border-bottom-left-radius:3px; }
    .ai-msg.typing{ align-self:flex-start; background:var(--teal-tint); color:var(--ink-soft); font-style:italic; }
    .ai-chat-foot{ display:flex; gap:6px; padding:9px; border-top:1px solid var(--border); }
    .ai-chat-foot input{ flex:1; padding:9px 12px; border:1px solid var(--border); border-radius:20px; font-size:12.5px; }
    .ai-chat-foot button{ width:36px; height:36px; border-radius:50%; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .ai-chat-foot button[disabled]{ opacity:.5; pointer-events:none; }
    .ai-chat-empty{ font-size:11.5px; color:var(--ink-soft); text-align:center; padding:22px 12px; }

    /* ---------- Relatório Missionário Integrado ---------- */
    .report-toolbar{ align-items:center; }
    .report-print-head{ display:none; }
    .report-section-title{
      font-size:14px; color:var(--teal-dark); margin:22px 0 10px; padding-bottom:6px;

  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#053067">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="offline.js"></script>
</head>
<body>
  <div id="app"></div>

  <script>
  (function(){
    // DIRECTORY: nomes de grupos apenas (sem dados sensíveis) — carregado sempre.
    let DIRECTORY = { pgs:[], classes:[], escolas:[], duplas:[] };
    // DB: dados completos (com telefone e hash de senha de grupo) — só existe após login de coordenador.
    let DB = null;
    let coordPw = null; // mantido só em memória, nunca salvo em disco/armazenamento

    // Localização padrão do mapa, caso nenhum PG ainda tenha coordenadas
    // salvas (aproximadamente Ji-Paraná/RO).
    const MAP_DEFAULT_CENTER = [-10.885, -61.951];

    let state = {
      loading:true,
      area:null,           // null | 'coord' | 'registro'
      coordStage:'idle',   // 'setup' | 'login' | 'app'
      profile:'home', tab:null, menuOpen:false,
      // registroStage: 'role' -> 'group' -> 'auth' (pg/classe/escola/dupla) -> 'panel'
      registroStage:'role', registroRole:null, registroGroupId:null,
      registroPw:null,
      registroScoped:null, registroEncontros:null, registroFrequencia:null,
      allPgLocations:null,
      // Notificações e chat de IA — só existem/aparecem para o coordenador logado.
      notifOpen:false, notificacoes:[],
      aiChatOpen:false, aiMessages:[], aiSending:false,
    };

    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    const esc = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const todayStr = () => new Date().toISOString().slice(0,10);

    // Datas são guardadas internamente em ISO (yyyy-MM-dd) — formato exigido
    // pelos campos <input type="date"> e o mais seguro contra a "adivinhação
    // de tipo" do Google Sheets. Para exibição em telas/tabelas, convertemos
    // para o formato brasileiro dd/mm/aaaa (evita a data aparecer "de trás
    // para frente" para quem lê no padrão brasileiro).
    function fmtDateBR(iso){
      if(!iso) return '—';
      const parts = String(iso).split('-');
      if(parts.length !== 3) return esc(iso);
      return parts[2] + '/' + parts[1] + '/' + parts[0];
    }

    // Data curta (dd/mm) para caber como cabeçalho de coluna na tabela de
    // frequência — o ano fica implícito (evita colunas largas demais).
    function fmtDateBRshort(iso){
      if(!iso) return '—';
      const parts = String(iso).split('-');
      if(parts.length !== 3) return esc(iso);
      return parts[2] + '/' + parts[1];
    }

    // Comparação de IDs blindada contra corrupção de tipo do Google Sheets:
    // uma célula que "parece número" ou "parece data" pode voltar da planilha
    // como Number/Date em vez de string. Normalizamos os dois lados para
    // string antes de comparar, em vez de usar === direto.
    const sid = (v) => (v === null || v === undefined) ? '' : String(v);
    const eqId = (a, b) => sid(a) !== '' && sid(a) === sid(b);

    // Monta a tabela de chamada no formato "diário de classe": 1ª coluna com
    // o nome de cada pessoa, colunas seguintes uma por encontro (data),
    // célula marcando presente/ausente. Clicar na data executa
    // `onHeaderClickJs(encontroId)` (normalmente abre a chamada daquele dia
    // para editar). Usado identicamente para PGs, Classes Bíblicas, Escolas
    // de Evangelismo E Duplas Missionárias — não há ramificação especial por
    // tipo aqui, então todos os quatro tipos de grupo sempre recebem
    // exatamente a mesma tabela de frequência.
    //
    // `onObsClickJs(encontroId)` é OPCIONAL: quando fornecido, e apenas
    // quando aquele encontro específico tiver `observacoes` preenchidas, um
    // pequeno ícone aparece ao lado da data. Clicar nele chama
    // `onObsClickJs(encontroId)` (normalmente abre um modal somente leitura
    // com o texto). Quando não fornecido (ex.: painel de registro), nenhum
    // ícone é desenhado — o comportamento para líderes/duplas continua
    // idêntico ao que já era.
    function buildFrequencyTable(membros, encontros, freqList, onHeaderClickJs, onObsClickJs){
      if(!membros || membros.length===0){
        return `<p style="font-size:11.5px;color:var(--ink-soft)">Cadastre pessoas para começar a fazer a chamada.</p>`;
      }
      if(!encontros || encontros.length===0){
        return `<p style="font-size:11.5px;color:var(--ink-soft)">Nenhum encontro registrado ainda.</p>`;
      }
      const ordenados = [...encontros].sort((a,b)=> (a.data < b.data ? -1 : 1));
      const freqMap = {};
      (freqList||[]).forEach(f=>{
        const eId = sid(f.encontroId);
        if(!freqMap[eId]) freqMap[eId] = {};
        freqMap[eId][sid(f.membroId)] = f.presente;
      });
      return `
        <div class="freq-table-wrap">
          <table class="freq-table">
            <thead><tr>
              <th>Nome</th>
              ${ordenados.map(e => `
                <th title="${fmtDateBR(e.data)} — ver/editar chamada">
                  <span class="freq-th-inner">
                    <span class="freq-th-date" onclick="${onHeaderClickJs(e.id)}">${fmtDateBRshort(e.data)}</span>
                    ${(e.observacoes && onObsClickJs) ? `<button type="button" class="obs-icon-btn" onclick="event.stopPropagation();${onObsClickJs(e.id)}" title="Ver observação registrada">${icon('note',12)}</button>` : ''}
                  </span>
                </th>`).join('')}
            </tr></thead>
            <tbody>
              ${membros.map(m => `
                <tr>
                  <td>${esc(m.nome)}</td>
                  ${ordenados.map(e=>{
                    const present = freqMap[sid(e.id)] ? !!freqMap[sid(e.id)][sid(m.id)] : false;
                    return `<td class="${present?'freq-present':'freq-absent'}">${present?icon('check',13):'–'}</td>`;
                  }).join('')}
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    }

    // ---------- Icons ----------
    function icon(name, size){
      size = size || 18;
      const paths = {
        menu: '<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>',
        close: '<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>',
        back: '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
        home: '<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10.5V20h12v-9.5"/><path d="M10 20v-5h4v5"/>',
        groups: '<circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c0-3 2.5-5.3 5.5-5.3s5.5 2.3 5.5 5.3"/><circle cx="17.5" cy="9" r="2.2"/><path d="M15.3 19c.2-2.2 1.8-3.9 4.2-4.2"/>',
        outreach: '<circle cx="6" cy="12" r="2.3"/><circle cx="18" cy="6" r="2.3"/><circle cx="18" cy="18" r="2.3"/><path d="M8.1 11l7.8-3.8"/><path d="M8.1 13l7.8 3.8"/>',
        search: '<circle cx="10.5" cy="10.5" r="6.2"/><line x1="15" y1="15" x2="20" y2="20"/>',
        book: '<path d="M4 5.5C6 4.3 9 4 12 5.2v14C9 18 6 18.3 4 19.5z"/><path d="M20 5.5C18 4.3 15 4 12 5.2v14c3-1.2 6-.9 8 .3z"/>',
        graduate: '<path d="M12 5 2 9l10 4 10-4z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/>',
        teacher: '<circle cx="12" cy="8" r="3.3"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/>',
        handshake: '<path d="M3 12l4-4 4 3 3-3 4 4"/><path d="M3 12v4l4 3"/><path d="M21 12v4l-4 3"/><path d="M11 11l-3 3 3 3"/><path d="M13 11l3 3-3 3"/>',
        plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
        lock: '<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
        edit: '<path d="M4 20l1-4 11-11 3 3-11 11z"/><path d="M14 6l3 3"/>',
        logout: '<path d="M9 7V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2v-2"/><path d="M3 12h12"/><path d="M11 8l4 4-4 4"/>',
        key: '<circle cx="8" cy="14" r="4"/><path d="M11 11l9-9"/><path d="M16 6l3 3"/><path d="M13 9l2 2"/>',
        pin: '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.4"/>',
        check: '<polyline points="4 12 9 17 20 6"/>',
        bell: '<path d="M6 8a6 6 0 0 1 12 0c0 4.2 1.4 5.6 1.4 5.6H4.6S6 12.2 6 8Z"/><path d="M9.3 17a2.7 2.7 0 0 0 5.4 0"/>',
        send: '<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/>',
        sparkle: '<path d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6L4.5 10.5l5.6-1.9z"/>',
        report: '<path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><path d="M8.5 13h7"/><path d="M8.5 16.5h7"/><path d="M8.5 9.5h3"/>',
        print: '<path d="M7 8V4h10v4"/><rect x="5" y="8" width="14" height="8" rx="1.4"/><path d="M7 16h10v5H7z"/>',
        phone: '<path d="M6.5 3.5h3l1.4 4-2 1.3a11 11 0 0 0 5.3 5.3l1.3-2 4 1.4v3a1.6 1.6 0 0 1-1.7 1.6A16.3 16.3 0 0 1 4.9 5.2 1.6 1.6 0 0 1 6.5 3.5z"/>',
        note: '<path d="M4 5.5h16a1 1 0 0 1 1 1V15a1 1 0 0 1-1 1H9l-4 3.5V16H4a1 1 0 0 1-1-1V6.5a1 1 0 0 1 1-1z"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="12.2" x2="13" y2="12.2"/>',
      };
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[name]||''}</svg>`;
    }

    // ---------- Bridge to Apps Script backend ----------
    function gsRun(fnName, ...args){ return MPOffline.call(fnName, args); }

    function toast(msg, isErr){
      const wrap = document.getElementById('toast-wrap');
      if(!wrap) return;
      const t = document.createElement('div');
      t.className = 'toast' + (isErr ? ' err' : '');
      t.textContent = msg;
      wrap.appendChild(t);
      setTimeout(() => t.remove(), 3400);
    }

    // ================= BOOT =================
    async function boot(){
      state.loading = true; render();
      try{
        DIRECTORY = await gsRun('getGroupsDirectory');
      }catch(err){
        toast('Erro ao carregar: ' + (err && err.message ? err.message : err), true);
      }
      state.loading = false; render();
    }

    window.enterArea = async function(area){
      state.area = area;
      if(area === 'registro'){
        state.registroStage = 'role'; state.registroRole = null; state.registroGroupId = null; state.registroPw = null;
        render(); return;
      }
      state.coordStage = 'idle';
      state.loading = true; render();
      try{
        const has = await gsRun('hasCoordinatorPassword');
        state.coordStage = has ? 'login' : 'setup';
      }catch(err){
        toast('Erro: ' + (err && err.message ? err.message : err), true);
        state.area = null;
      }
      state.loading = false; render();
    };

    window.backToChooser = function(){
      state.area = null; state.coordStage = 'idle'; render();
    };

    // ================= AUTENTICAÇÃO DO COORDENADOR (senha mestre) =================
    window.submitSetup = async function(){
      const pw = document.getElementById('f-pw').value;
      const pw2 = document.getElementById('f-pw2').value;
      if(pw.length < 4){ toast('A senha deve ter ao menos 4 caracteres.', true); return; }
      if(pw !== pw2){ toast('As senhas não coincidem.', true); return; }
      try{
        await gsRun('setupCoordinatorPassword', pw);
        coordPw = pw;
        await enterCoordApp();
      }catch(err){ toast(err.message || 'Erro ao criar senha.', true); }
    };

    window.submitLogin = async function(){
      const pw = document.getElementById('f-pw').value;
      try{
        const ok = await gsRun('checkCoordinatorPassword', pw);
        if(!ok){ toast('Senha incorreta.', true); return; }
        coordPw = pw;
        await enterCoordApp();
      }catch(err){ toast(err.message || 'Erro ao entrar.', true); }
    };

    async function enterCoordApp(){
      state.coordStage = 'app';
      state.loading = true; render();
      try{
        // Uma única chamada ao servidor: getCoordinatorBootData já traz os
        // dados completos (equivalente a getAllData) E as notificações
        // pendentes (equivalente a getNotificacoesPendentes) juntos,
        // reaproveitando leituras internamente no servidor — antes eram
        // duas chamadas separadas (dois "round trips" completos ao Apps
        // Script) só para abrir o painel.
        const boot = await gsRun('getCoordinatorBootData', coordPw);
        DB = boot.db;
        DB.encontros = DB.encontros || [];
        DB.frequencia = DB.frequencia || [];
        state.notificacoes = boot.notificacoesPendentes || [];
      }catch(err){
        toast('Entrou, mas falhou ao carregar os dados: ' + (err && err.message ? err.message : err), true);
        state.coordStage = 'login'; coordPw = null;
        state.loading = false; render();
        return;
      }
      state.loading = false; render();
    }

    window.logoutCoord = function(){
      coordPw = null; DB = null;
      state.area = null; state.coordStage = 'idle';
      state.profile = 'home'; state.tab = null; state.menuOpen = false;
      state.notifOpen = false; state.notificacoes = [];
      state.aiChatOpen = false; state.aiMessages = []; state.aiSending = false;
      render();
    };

    window.openChangePasswordModal = function(){
      openModal(`
        <h3>Alterar senha mestre</h3>
        <div class="field"><label>Senha atual</label><input type="password" id="f-old"></div>
        <div class="field"><label>Nova senha</label><input type="password" id="f-new"></div>
        <div class="field"><label>Confirmar nova senha</label><input type="password" id="f-new2"></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="submitChangePassword()">Salvar</button>
        </div>
      `);
    };
    window.submitChangePassword = async function(){
      const oldPw = document.getElementById('f-old').value;
      const newPw = document.getElementById('f-new').value;
      const newPw2 = document.getElementById('f-new2').value;
      if(newPw.length < 4){ toast('Nova senha muito curta.', true); return; }
      if(newPw !== newPw2){ toast('As senhas não coincidem.', true); return; }
      try{
        await gsRun('changeCoordinatorPassword', oldPw, newPw);
        coordPw = newPw;
        closeModal();
        toast('Senha alterada.');
      }catch(err){ toast(err.message || 'Erro ao alterar senha.', true); }
    };

    async function persist(key){
      try{
        const ok = await gsRun('saveSheetData', key, DB[key], coordPw);
        if(!ok) toast('Não foi possível salvar.', true);
      }catch(err){
        toast('Erro ao salvar: ' + (err && err.message ? err.message : ''), true);
      }
    }

    function go(profile, tab){ state.profile = profile; state.tab = tab || null; state.menuOpen = false; render(); window.scrollTo(0,0); }
    window.go = go;
    window.toggleMenu = function(){ state.menuOpen = !state.menuOpen; render(); };

    // ---------- Modal ----------
    function openModal(html){
      closeModal();
      const ov = document.createElement('div');
      ov.className = 'overlay'; ov.id = 'modal-overlay';
      ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
      ov.addEventListener('mousedown', e => { if(e.target === ov) closeModal(); });
      document.body.appendChild(ov);
    }
    function closeModal(){ const ov = document.getElementById('modal-overlay'); if(ov) ov.remove(); }
    window.closeModal = closeModal;

    // Modal somente leitura para mostrar uma observação registrada (chamada
    // de PG/Classe/Escola ou visita de Dupla). Não editável por aqui — só
    // exibe o texto que o líder/instrutor/dupla já escreveu no Painel de
    // Registro ao registrar o encontro.
    function showObsModal(titulo, texto){
      openModal(`
        <h3>${icon('note',15)} Observação</h3>
        <p style="font-size:11.5px;color:var(--ink-soft);margin-bottom:10px">${esc(titulo)}</p>
        <p style="font-size:13px;line-height:1.5;white-space:pre-wrap;background:var(--teal-tint);padding:12px;border-radius:8px">${esc(texto)}</p>
        <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Fechar</button></div>
      `);
    }
    window.viewObsEncontro = function(tipo, grupoId, encontroId){
      const e = (DB.encontros||[]).find(x=>eqId(x.id, encontroId));
      if(!e || !e.observacoes) return;
      showObsModal((tipo==='dupla'?'Visita':'Encontro') + ' — ' + fmtDateBR(e.data), e.observacoes);
    };

    // Mesma ideia, para a observação de uma PESSOA (interessado/membro) —
    // esse campo já existia (editável em "Editar interessado"/"Editar
    // membro"), mas até agora nenhuma listagem mostrava que ele tinha
    // conteúdo. É uma fonte rica de contexto sobre o interessado (o que já
    // foi conversado, dificuldades, pedidos de oração etc.), então vale
    // aparecer em toda lista onde a pessoa é exibida.
    window.viewObsMembro = function(memberId){
      const m = (DB.membros||[]).find(x=>eqId(x.id, memberId));
      if(!m || !m.observacoes) return;
      showObsModal('Observação — ' + m.nome, m.observacoes);
    };
    // Ícone pequeno para colocar ao lado do nome em qualquer listagem de
    // pessoa. Só desenha algo quando há texto de observação registrado.
    function memberObsIconHtml(m){
      if(!m || !m.observacoes) return '';
      return ` <button type="button" class="obs-icon-btn" onclick="viewObsMembro('${m.id}')" title="Ver observação registrada">${icon('note',12)}</button>`;
    }

    // ================= DERIVED HELPERS (coordenador) =================
    // Retorna as pessoas de um grupo. Para pg/classe/escola, o vínculo é via
    // origem+grupoId; para dupla, o vínculo é via duplaId (interessados
    // podem vir de qualquer origem, ou avulsos, e são atribuídos a uma dupla
    // separadamente).
    function membrosDe(tipo, grupoId){
      if(tipo === 'dupla') return DB.membros.filter(m => eqId(m.duplaId, grupoId));
      return DB.membros.filter(m => m.origem===tipo && eqId(m.grupoId, grupoId));
    }
    function naoBatizados(){ return DB.membros.filter(m => !m.batizado); }
    function batizados(){ return DB.membros.filter(m => m.batizado); }
    function origemLabel(m){
      if(m.origem==='pg'){ const g=DB.pgs.find(x=>eqId(x.id, m.grupoId)); return g ? 'PG · '+g.nome : 'PG'; }
      if(m.origem==='classe'){ const g=DB.classes.find(x=>eqId(x.id, m.grupoId)); return g ? 'Classe · '+g.nome : 'Classe Bíblica'; }
      if(m.origem==='escola'){ const g=DB.escolas.find(x=>eqId(x.id, m.grupoId)); return g ? 'Escola · '+g.nome : 'Escola de Evangelismo'; }
      return 'Sem grupo';
    }
    function professoresDe(area, grupoId){ return DB.professores.filter(p => p.area===area && (!grupoId || eqId(p.grupoId, grupoId))); }

    const PROFILES = [
      {id:'home', label:'Início', ic:'home'},
      {id:'pgs', label:'Coord. de PGs', ic:'groups'},
      {id:'ministerio', label:'Coord. Ministério Pessoal', ic:'outreach'},
      {id:'interessados', label:'Coord. de Interessados', ic:'search'},
      {id:'relatorio', label:'Relatório Missionário', ic:'report'},
    ];

    function render(){
      renderInner();
      setTimeout(afterRenderHook, 0);
    }

    function afterRenderHook(){
      if(state.area==='registro' && state.registroStage==='group' && state.registroRole==='pg'){
        initAllPgsMap('map-all-pgs', state.allPgLocations);
      }
      if(state.area==='registro' && state.registroStage==='panel' && state.registroRole==='pg'){
        initMyPgMap();
      }
      if(state.area==='coord' && state.coordStage==='app' && state.profile==='pgs'){
        initAllPgsMap('map-coord-pgs', DB.pgs);
      }
    }

    function initAllPgsMap(divId, list){
      if(typeof L === 'undefined') return;
      const div = document.getElementById(divId);
      if(!div || div._leaflet_id) return;
      const m = L.map(div).setView(MAP_DEFAULT_CENTER, 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap', maxZoom: 19
      }).addTo(m);
      const pts = [];
      (list||[]).forEach(g=>{
        if(g.lat!=null && g.lng!=null){
          L.marker([g.lat, g.lng]).addTo(m)
            .bindPopup('<b>'+esc(g.nome)+'</b><br>'+esc(g.lider||'')+(g.dia?'<br>'+esc(g.dia):'')+(g.local?'<br>'+esc(g.local):''));
          pts.push([g.lat, g.lng]);
        }
      });
      if(pts.length) m.fitBounds(pts, {maxZoom:14, padding:[20,20]});
      setTimeout(()=>m.invalidateSize(), 60);
    }

    function renderInner(){
      const app = document.getElementById('app');
      if(state.loading){ app.innerHTML = loadingScreen() + toastWrap(); return; }
      if(!state.area){ app.innerHTML = areaChooser() + toastWrap(); return; }
      if(state.area === 'coord'){
        if(state.coordStage === 'setup'){ app.innerHTML = setupScreen() + toastWrap(); return; }
        if(state.coordStage === 'login'){ app.innerHTML = loginScreen() + toastWrap(); return; }
        // Notificações e o chat de IA só existem aqui — no painel logado do
        // coordenador. Em nenhuma outra tela (nem no Painel de Registro)
        // esses widgets são renderizados.
        app.innerHTML = `${topbar()}${state.menuOpen?drawer():''}<main>${body()}</main>${aiWidget()}${toastWrap()}`;
        return;
      }
      app.innerHTML = `${registroTopbar()}<main>${registroBody()}</main>${toastWrap()}`;
    }

    function aiChatPanel(){
      const msgs = state.aiMessages || [];
      return `
        <div class="ai-chat">

              msgs.map(m=>`<div class="ai-msg ${m.role}">${esc(m.text)}</div>`).join('')}

    window.toggleAiChat = function(){ state.aiChatOpen = !state.aiChatOpen; render(); scrollAiChatToBottom(); };
    window.sendAiMessage = async function(){
      if(state.aiSending) return;
      const input = document.getElementById('f-ai-input');
      const text = input ? input.value.trim() : '';
      if(!text) return;
      state.aiMessages = state.aiMessages || [];
      state.aiMessages.push({ role:'user', text });
      state.aiSending = true;
      render(); scrollAiChatToBottom();
      try{
        const resposta = await gsRun('askGroq', text, coordPw);
        state.aiMessages.push({ role:'bot', text: resposta || '(sem resposta)' });
      }catch(err){
        state.aiMessages.push({ role:'bot', text: 'Erro ao consultar a IA: ' + (err && err.message ? err.message : 'tente novamente em instantes.') });
      }
      state.aiSending = false;
      render(); scrollAiChatToBottom();
    };

    function groupListSection(tipo, list, cfg){

    window.openGroupForm = function(tipo, id){
      const listMap = {pg:DB.pgs, classe:DB.classes, escola:DB.escolas};

      const item = id ? list.find(x=>eqId(x.id, id)) : null;

        ? {nome:'Nome do PG', lider:'Líder', dia:'Dia e horário', local:'Local de encontro'}
        : tipo==='classe'
        ? {nome:'Nome da classe', lider:'Instrutor responsável', dia:'Dia e horário', local:'Local'}
        : {nome:'Nome da turma', lider:'Coordenador da turma', dia:'Dia e horário', local:'Local'};

      openModal(`
        <h3>${item?'Editar registro':'Novo registro'}</h3>
        <div class="field"><label>${labels.nome}</label><input type="text" id="f-nome" value="${item?esc(item.nome):''}"></div>

    window.saveGroup = async function(tipo, id){
      const listMap = {pg:'pgs', classe:'classes', escola:'escolas'};
      const key = listMap[tipo];
      const nome = document.getElementById('f-nome').value.trim();
      if(!nome){ toast('Informe um nome.', true); return; }
      const pwRaw = document.getElementById('f-senha').value.trim();
      if(!id && !pwRaw){ toast('Defina uma senha de acesso para este grupo — ela será usada pelo líder/instrutor no Painel de Registro.', true); return; }
      const data = {
        nome,
        lider: document.getElementById('f-lider').value.trim(),
        liderTelefone: document.getElementById('f-lider-tel').value.trim(),
        dia: document.getElementById('f-dia').value.trim(),
        local: document.getElementById('f-local').value.trim(),
      };
      if(pwRaw){
        try{ data.senha = await gsRun('hashGroupPassword', pwRaw); }
        catch(err){ toast(err.message || 'Senha inválida (mínimo 4 caracteres).', true); return; }
      }
      if(id){ Object.assign(DB[key].find(x=>eqId(x.id, id)), data); }
      else { DB[key].push({ id: uid(), ...data }); }
      persist(key);
      closeModal();
      toast('Salvo.');
      render();
    };

    window.deleteGroup = function(tipo, id){
      if(!confirm('Excluir este registro? Os membros vinculados ficarão sem grupo.')) return;
      const listMap = {pg:'pgs', classe:'classes', escola:'escolas'};
      const key = listMap[tipo];
      DB[key] = DB[key].filter(x=>!eqId(x.id, id));
      DB.membros.forEach(m => { if(m.origem===tipo && eqId(m.grupoId, id)){ m.grupoId=null; m.origem='avulso'; } });
      const removedEncontroIds = (DB.encontros||[]).filter(e=>e.tipo===tipo && eqId(e.grupoId, id)).map(e=>e.id);
      DB.encontros = (DB.encontros||[]).filter(e=>!(e.tipo===tipo && eqId(e.grupoId, id)));
      DB.frequencia = (DB.frequencia||[]).filter(f=>!removedEncontroIds.some(rid=>eqId(f.encontroId, rid)));
      persist(key); persist('membros'); persist('encontros'); persist('frequencia');
      toast('Excluído.');
      render();
    };

            </div>`).join('')}</div>`
        }

    window.openMemberForm = function(tipo, grupoId, memberId){
      const item = memberId ? DB.membros.find(m=>eqId(m.id, memberId)) : null;
      openModal(`
        <h3>${item?'Editar membro':'Novo membro'}</h3>
        <div class="field"><label>Nome completo</label><input type="text" id="f-nome" value="${item?esc(item.nome):''}"></div>
        <div class="field"><label>Telefone</label><input type="tel" id="f-tel" value="${item?esc(item.telefone||''):''}"></div>
        <div class="field checkline">
          <input type="checkbox" id="f-batizado" ${item&&item.batizado?'checked':''}>
          <label for="f-batizado">Já é batizado(a)</label>
        </div>
        <div class="field"><label>Observações</label><textarea id="f-obs" placeholder="Ex: pediu oração pela família, prefere estudar à noite, já leu parte de Mateus...">${item?esc(item.observacoes||''):''}</textarea></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>

      `);
      document.getElementById('f-nome').focus();

    window.saveMember = function(tipo, grupoId, memberId){
      const nome = document.getElementById('f-nome').value.trim();
      if(!nome){ toast('Informe o nome do membro.', true); return; }
      const data = {
        nome,
        telefone: document.getElementById('f-tel').value.trim(),
        batizado: document.getElementById('f-batizado').checked,
        observacoes: document.getElementById('f-obs').value.trim(),
      };
      if(memberId){
        const m = DB.membros.find(x=>eqId(x.id, memberId));
        Object.assign(m, data);
        if(data.batizado && !m.dataBatismo) m.dataBatismo = todayStr();
        if(!data.batizado) m.dataBatismo = null;
      } else {
        DB.membros.push({
          id: uid(), origem: tipo, grupoId: grupoId || null, duplaId: null,
          dataBatismo: data.batizado ? todayStr() : null,
          observacoes:'', ...data
        });
      }
      persist('membros');
      closeModal();
      toast('Membro salvo.');
      if(grupoId) openGroupMembers(tipo, grupoId); else render();
    };

    // Bloco de "chamada" (encontros + frequência), reutilizado por PG,
    // Classe Bíblica, Escola de Evangelismo E Dupla Missionária — sempre a
    // mesma tabela de frequência (buildFrequencyTable), sem exceção por tipo.
    // O quinto argumento passado a buildFrequencyTable liga o ícone de
    // observação: aparece apenas quando aquele encontro específico já tem
    // texto registrado (pelo líder/instrutor/dupla no Painel de Registro).
    function encontrosBlockHtml(tipo, grupoId, membros){
      const encontros = (DB.encontros||[]).filter(e=>e.tipo===tipo && eqId(e.grupoId, grupoId));
      const tituloBloco = tipo==='dupla' ? 'VISITAS / ESTUDOS' : 'CHAMADA';
      const rotuloBtn = tipo==='dupla' ? 'Registrar visita' : 'Registrar';
      return `
        <div style="display:flex;justify-content:space-between;align-items:center;margin:15px 0 7px">
          <span class="modal-sub-label">${tituloBloco}</span>
        </div>
        <div style="display:flex;gap:6px;align-items:flex-end;margin-bottom:10px">
          <input type="date" id="f-encontro-data" value="${todayStr()}" style="flex:1;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:12.5px">
          <button class="btn btn-primary btn-sm" onclick="addEncontroCoord('${tipo}','${grupoId}')">${rotuloBtn}</button>
        </div>
        <p style="font-size:10.5px;color:var(--ink-soft);margin:0 0 8px">
          ${icon('note',11)} Quando o líder, instrutor ou dupla registrar uma observação para um encontro, um ícone aparece ao lado da data abaixo — toque nele para ler.
        </p>
        ${buildFrequencyTable(
          membros, encontros, DB.frequencia,
          (encontroId)=>`openChamadaCoord('${tipo}','${grupoId}','${encontroId}')`,
          (encontroId)=>`viewObsEncontro('${tipo}','${grupoId}','${encontroId}')`
        )}
      `;
    }
    window.addEncontroCoord = function(tipo, grupoId){
      const data = document.getElementById('f-encontro-data').value.trim();
      if(!data){ toast('Informe a data.', true); return; }
      const id = uid();
      DB.encontros.push({ id, tipo, grupoId, data, observacoes:'' });
      persist('encontros');
      toast(tipo==='dupla' ? 'Visita registrada. Agora marque quem foi visitado.' : 'Encontro registrado. Agora marque a chamada.');
      openChamadaCoord(tipo, grupoId, id);
    };
    window.deleteEncontroCoord = function(id, tipo, grupoId){
      if(!confirm('Excluir este encontro e toda a chamada dele?')) return;
      DB.encontros = DB.encontros.filter(e=>!eqId(e.id, id));
      DB.frequencia = DB.frequencia.filter(f=>!eqId(f.encontroId, id));
      persist('encontros'); persist('frequencia');
      toast('Removido.');
      if(tipo==='dupla') openDuplaDetails(grupoId); else openGroupMembers(tipo, grupoId);
    };
    window.openChamadaCoord = function(tipo, grupoId, encontroId){
      const membros = membrosDe(tipo, grupoId);
      const freqMap = {};
      (DB.frequencia||[]).filter(f=>eqId(f.encontroId, encontroId)).forEach(f=>{ freqMap[sid(f.membroId)] = f.presente; });
      const enc = (DB.encontros||[]).find(e=>eqId(e.id, encontroId));
      openModal(`
        <h3>${tipo==='dupla'?'Visita':'Chamada'} — ${fmtDateBR(enc?enc.data:'')}</h3>
        ${membros.length===0 ? '<p style="font-size:12px;color:var(--ink-soft)">Nenhum membro neste grupo.</p>' : `
        <div style="max-height:300px;overflow-y:auto;margin-bottom:8px">
          ${membros.map(m=>`
            <div class="checkline" style="margin-bottom:6px">
              <input type="checkbox" id="chk-${m.id}" ${freqMap[sid(m.id)]?'checked':''}>
              <label for="chk-${m.id}">${esc(m.nome)}</label>
            </div>`).join('')}
        </div>`}
        <div class="modal-actions">
          <button class="btn btn-danger-ghost" onclick="deleteEncontroCoord('${encontroId}','${tipo}','${grupoId}')">Excluir</button>
          <button class="btn btn-ghost" onclick="${tipo==='dupla'?`openDuplaDetails('${grupoId}')`:`openGroupMembers('${tipo}','${grupoId}')`}">Voltar</button>
          <button class="btn btn-primary" onclick="saveChamadaCoord('${tipo}','${grupoId}','${encontroId}')">Salvar</button>
        </div>
      `);
    };
    window.saveChamadaCoord = function(tipo, grupoId, encontroId){
      const membros = membrosDe(tipo, grupoId);
      DB.frequencia = (DB.frequencia||[]).filter(f=>!eqId(f.encontroId, encontroId));
      membros.forEach(m=>{
        const el = document.getElementById('chk-'+m.id);
        DB.frequencia.push({ id: uid(), encontroId, membroId: m.id, presente: el ? el.checked : false });
      });
      persist('frequencia');
      toast('Salvo.');
      if(tipo==='dupla') openDuplaDetails(grupoId); else openGroupMembers(tipo, grupoId);
    };
