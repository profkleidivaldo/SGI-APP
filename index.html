    window.saveDupla = async function(id){
      const nome1 = document.getElementById('f-n1').value.trim();
      if(!nome1){ toast('Informe ao menos o nome do 1º missionário.', true); return; }
      const pwRaw = document.getElementById('f-senha').value.trim();
      if(!id && !pwRaw){ toast('Defina uma senha de acesso para esta dupla — ela será usada no Painel de Registro.', true); return; }
      const data = {
        nome1,
        telefone1: document.getElementById('f-tel1').value.trim(),
        nome2: document.getElementById('f-n2').value.trim(),
        telefone2: document.getElementById('f-tel2').value.trim(),
        area: document.getElementById('f-area').value.trim(),
        dia: document.getElementById('f-dia').value.trim(),
      };
      if(pwRaw){
        try{ data.senha = await gsRun('hashGroupPassword', pwRaw); }
        catch(err){ toast(err.message || 'Senha inválida (mínimo 4 caracteres).', true); return; }
      }
      if(id){ Object.assign(DB.duplas.find(d=>eqId(d.id, id)), data); }
      else { DB.duplas.push({ id: uid(), ...data }); }
      persist('duplas');
      closeModal();
      toast('Dupla salva.');
      render();
    };

    window.deleteDupla = function(id){
      if(!confirm('Excluir esta dupla?')) return;
      DB.duplas = DB.duplas.filter(d=>!eqId(d.id, id));
      DB.membros.forEach(m => { if(eqId(m.duplaId, id)) m.duplaId=null; });
      const removedEncontroIds = (DB.encontros||[]).filter(e=>e.tipo==='dupla' && eqId(e.grupoId, id)).map(e=>e.id);
      DB.encontros = (DB.encontros||[]).filter(e=>!(e.tipo==='dupla' && eqId(e.grupoId, id)));
      DB.frequencia = (DB.frequencia||[]).filter(f=>!removedEncontroIds.some(rid=>eqId(f.encontroId, rid)));
      persist('duplas'); persist('membros'); persist('encontros'); persist('frequencia');
      toast('Excluída.');
      render();
    };

    // Detalhes de uma dupla — segue exatamente o mesmo padrão de PG/Classe/
    // Escola (openGroupMembers): lista de pessoas vinculadas, com botão para
    // adicionar/editar, seguida do bloco de chamada (encontrosBlockHtml, que
    // sempre renderiza a tabela de frequência via buildFrequencyTable, com o
    // ícone de observação incluso).
    window.openDuplaDetails = function(duplaId){
      const d = DB.duplas.find(x=>eqId(x.id, duplaId));
      const membros = membrosDe('dupla', duplaId);
      openModal(`
        <h3>${esc(d.nome1)} &amp; ${esc(d.nome2)}</h3>
        <p style="font-size:11.5px;color:var(--ink-soft);margin-bottom:4px">${esc(d.area||'')} ${d.dia?'· '+esc(d.dia):''}</p>
        ${(d.telefone1||d.telefone2) ? `<p style="font-size:11.5px;color:var(--ink-soft);margin-bottom:8px">
          ${d.telefone1?icon('phone',10)+' '+esc(d.nome1)+': '+esc(d.telefone1):''}${(d.telefone1&&d.telefone2)?' &nbsp;·&nbsp; ':''}${d.telefone2?icon('phone',10)+' '+esc(d.nome2)+': '+esc(d.telefone2):''}
        </p>` : ''}
        <div style="margin-bottom:13px">
          <span class="badge ${d.senha ? 'badge-lock-ok' : 'badge-lock-warn'}">${icon('lock',11)} ${d.senha ? 'Senha configurada' : 'Sem senha — Registro bloqueado'}</span>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
          <span class="modal-sub-label">INTERESSADOS VINCULADOS (${membros.length})</span>
          <button class="btn btn-primary btn-sm" onclick="openMemberFormDupla('${duplaId}')">+ Interessado</button>
        </div>
        ${membros.length===0 ? '<p style="font-size:11.5px;color:var(--ink-soft);margin-bottom:8px">Nenhum interessado vinculado ainda. Adicione aqui, ou vincule um já cadastrado pela aba Interessados.</p>' :
          `<div style="margin-bottom:8px">${membros.map(m=>`
            <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);gap:8px">
              <div>
                <div style="font-size:12.5px;font-weight:600">${esc(m.nome)}${memberObsIconHtml(m)}</div>
                <div style="font-size:10.5px;color:var(--ink-soft)">${esc(m.telefone||'—')}</div>
              </div>
              <div style="display:flex;align-items:center;gap:7px;flex-shrink:0">
                <span class="badge ${m.batizado?'badge-baptized':'badge-interest'}">${m.batizado?'Batizado':'Interessado'}</span>
                <button class="icon-btn" onclick="openMemberFormDupla('${duplaId}','${m.id}')">Editar</button>
              </div>
            </div>`).join('')}</div>`
        }
        ${encontrosBlockHtml('dupla', duplaId, membros)}
        <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Fechar</button></div>
      `);
    };

    // Formulário de interessado vinculado diretamente a uma dupla (o
    // coordenador cadastra/edita sem precisar passar pela aba Interessados
    // e reatribuir manualmente) — mesma cara do formulário usado para
    // PG/Classe/Escola, mas gravando via duplaId em vez de origem+grupoId,
    // para casar com o modelo usado por getGroupMembers/membrosDe('dupla',…).
    window.openMemberFormDupla = function(duplaId, memberId){
      const item = memberId ? DB.membros.find(m=>eqId(m.id, memberId)) : null;
      openModal(`
        <h3>${item?'Editar interessado':'Novo interessado'}</h3>
        <div class="field"><label>Nome completo</label><input type="text" id="f-nome" value="${item?esc(item.nome):''}"></div>
        <div class="field"><label>Telefone</label><input type="tel" id="f-tel" value="${item?esc(item.telefone||''):''}"></div>
        <div class="field checkline">
          <input type="checkbox" id="f-batizado" ${item&&item.batizado?'checked':''}>
          <label for="f-batizado">Já é batizado(a)</label>
        </div>
        <div class="field"><label>Observações</label><textarea id="f-obs" placeholder="Ex: pediu oração pela família, prefere estudar à noite, já leu parte de Mateus...">${item?esc(item.observacoes||''):''}</textarea></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="saveMemberDupla('${duplaId}','${memberId||''}')">Salvar</button>
        </div>
      `);
      document.getElementById('f-nome').focus();
    };

    window.saveMemberDupla = function(duplaId, memberId){
      const nome = document.getElementById('f-nome').value.trim();
      if(!nome){ toast('Informe o nome.', true); return; }
      const data = {
        nome,
        telefone: document.getElementById('f-tel').value.trim(),
        batizado: document.getElementById('f-batizado').checked,
        observacoes: document.getElementById('f-obs').value.trim(),
      };
      if(memberId){
        const m = DB.membros.find(x=>eqId(x.id, memberId));
        Object.assign(m, data);
        if(data.batizado && !m.dataBatismo) m.dataBatismo = todayStr();
        if(!data.batizado) m.dataBatismo = null;
      } else {
        DB.membros.push({
          id: uid(), origem:'avulso', grupoId:null, duplaId: duplaId,
          dataBatismo: data.batizado ? todayStr() : null,
          observacoes:'', ...data
        });
      }
      persist('membros');
      closeModal();
      toast('Salvo.');
      openDuplaDetails(duplaId);
    };

    function interessadosMinisterioSection(){
      const lista = naoBatizados();
      if(lista.length===0){
        return `<div class="empty"><div class="ic">${icon('search',32)}</div><h4>Nenhum interessado cadastrado</h4></div>`;
      }
      if(DB.duplas.length===0){
        return `<div class="notice">Cadastre uma dupla na aba "Duplas" para vincular interessados.</div>` + interessadosTable(lista, false);
      }
      return interessadosTable(lista, true);
    }

    function interessadosTable(lista, allowAssign){
      return `
        <table>
          <thead><tr><th>Nome</th><th>Origem</th><th>Telefone</th><th>Dupla</th></tr></thead>
          <tbody>
            ${lista.map(m=>`
              <tr>
                <td data-label="Nome">${esc(m.nome)}${memberObsIconHtml(m)}</td>
                <td data-label="Origem"><span class="badge badge-neutral">${esc(origemLabel(m))}</span></td>
                <td data-label="Telefone">${esc(m.telefone||'—')}</td>
                <td data-label="Dupla">
                  ${allowAssign ? `
                    <select class="inline-select" onchange="assignDupla('${m.id}', this.value)">
                      <option value="">—</option>
                      ${DB.duplas.map(d=>`<option value="${d.id}" ${eqId(m.duplaId, d.id)?'selected':''}>${esc(d.nome1)} &amp; ${esc(d.nome2)}</option>`).join('')}
                    </select>
                  ` : '—'}
                </td>
              </tr>`).join('')}
          </tbody>
        </table>`;
    }

    window.assignDupla = function(memberId, duplaId){
      const m = DB.membros.find(x=>eqId(x.id, memberId));
      m.duplaId = duplaId || null;
      persist('membros');
      toast('Atualizado.');
    };

    // ================= RELATÓRIO MISSIONÁRIO INTEGRADO =================
    // Junta PGs, Classes Bíblicas, Escolas de Evangelismo e Duplas
    // Missionárias num único relatório, inspirado no modelo em papel usado
    // pela igreja: uma grade por grupo com o nome de cada pessoa numa linha
    // e uma coluna por encontro/estudo (numerada 1, 2, 3…) marcada com "x"
    // quando houve presença — mais um cabeçalho com os totais do grupo
    // (nº de responsáveis, nº de estudantes/membros) e um rodapé com os
    // percentuais de envolvimento, do jeito que o relatório em papel fecha
    // com "X% da comissão / dos membros envolvida em estudo bíblico".

    const REPORT_LABELS = {
      dupla:  { titulo:'Duplas Missionárias', respLabel:'Missionários', pessoaLabel:'Interessado', vazio:'Nenhuma dupla cadastrada.' },
      pg:     { titulo:'Pequenos Grupos',      respLabel:'Líder',        pessoaLabel:'Membro',      vazio:'Nenhum PG cadastrado.' },
      classe: { titulo:'Classes Bíblicas',     respLabel:'Instrutor',    pessoaLabel:'Aluno',       vazio:'Nenhuma classe cadastrada.' },
      escola: { titulo:'Escola de Evangelismo',respLabel:'Coordenador',  pessoaLabel:'Aluno',       vazio:'Nenhuma turma cadastrada.' },
    };

    // Monta a grade de um único grupo (uma dupla, um PG, uma classe...):
    // cabeçalho com colunas numeradas 1..N (uma por encontro, em ordem
    // cronológica) e uma linha por pessoa com "x" nos encontros em que
    // esteve presente — igual ao papel usado hoje pela igreja.
    function reportGroupGrid(tipo, grupo){
      const membros = membrosDe(tipo, grupo.id);
      const encontros = [...(DB.encontros||[])].filter(e=>e.tipo===tipo && eqId(e.grupoId, grupo.id))
        .sort((a,b)=> (a.data < b.data ? -1 : 1));
      const freqMap = {};
      (DB.frequencia||[]).forEach(f=>{
        const eId = sid(f.encontroId);
        if(!freqMap[eId]) freqMap[eId] = {};
        freqMap[eId][sid(f.membroId)] = f.presente;
      });
      const totalPorMembro = (membroId) => encontros.reduce((n,e)=>{
        const p = freqMap[sid(e.id)] ? !!freqMap[sid(e.id)][sid(membroId)] : false;
        return n + (p?1:0);
      }, 0);

      if(membros.length===0){
        return `<p style="font-size:11.5px;color:var(--ink-soft);padding:8px 0">Nenhuma pessoa cadastrada neste grupo.</p>`;
      }
      if(encontros.length===0){
        return `<p style="font-size:11.5px;color:var(--ink-soft);padding:8px 0">Nenhum encontro registrado ainda — a grade aparece aqui assim que houver ao menos um.</p>`;
      }
      return `
        <div class="freq-table-wrap">
          <table class="freq-table report-grid">
            <thead><tr>
              <th>${REPORT_LABELS[tipo].pessoaLabel}</th>
              <th>Nº estudos</th>
              ${encontros.map((e,i)=>`<th title="${fmtDateBR(e.data)}">${i+1}</th>`).join('')}
            </tr></thead>
            <tbody>
              ${membros.map(m=>`
                <tr>
                  <td>${esc(m.nome)}</td>
                  <td class="report-total">${totalPorMembro(m.id)}</td>
                  ${encontros.map(e=>{
                    const present = freqMap[sid(e.id)] ? !!freqMap[sid(e.id)][sid(m.id)] : false;
                    return `<td class="${present?'freq-present':'freq-absent'}">${present?icon('check',12):'–'}</td>`;
                  }).join('')}
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    }

    // Cabeçalho de resumo de um grupo (equivalente às colunas "Nº Miss. /
    // Missionários / Impactos / Nº Estudantes" do relatório em papel):
    // quantos responsáveis, quantos encontros já feitos e quantas pessoas
    // estão sendo acompanhadas.
    function reportGroupCard(tipo, grupo){
      const membros = membrosDe(tipo, grupo.id);
      const encontros = (DB.encontros||[]).filter(e=>e.tipo===tipo && eqId(e.grupoId, grupo.id));
      const nomeGrupo = tipo==='dupla' ? (esc(grupo.nome1) + (grupo.nome2 ? ' &amp; ' + esc(grupo.nome2) : '')) : esc(grupo.nome);
      const nMissionarios = tipo==='dupla' ? (grupo.nome2 ? 2 : 1) : null;
      return `
        <div class="report-group">
          <div class="report-group-head">
            <div>
              <h4>${nomeGrupo}</h4>
              <div class="meta">
                ${tipo!=='dupla' ? `${REPORT_LABELS[tipo].respLabel}: ${esc(grupo.lider||'—')} · ` : ''}
                ${nMissionarios!==null ? `${nMissionarios} missionário${nMissionarios>1?'s':''} · ` : ''}
                ${encontros.length} encontro${encontros.length===1?'':'s'} registrado${encontros.length===1?'':'s'} ·
                ${membros.length} ${REPORT_LABELS[tipo].pessoaLabel.toLowerCase()}${membros.length===1?'':'s'}
              </div>
            </div>
          </div>
          ${reportGroupGrid(tipo, grupo)}
        </div>`;
    }

    function reportSection(tipo, list){
      const cfg = REPORT_LABELS[tipo];
      if(list.length===0){
        return `<h3 class="report-section-title">${cfg.titulo}</h3><p style="font-size:11.5px;color:var(--ink-soft);margin-bottom:16px">${cfg.vazio}</p>`;
      }
      return `
        <h3 class="report-section-title">${cfg.titulo}</h3>
        ${list.map(g=>reportGroupCard(tipo, g)).join('')}
      `;
    }

    // Percentuais do rodapé, no mesmo espírito do relatório em papel
    // ("50% da comissão envolvida em estudo bíblico" / "30% dos membros
    // envolvida em estudo bíblico"): aqui calculados sobre os dados reais
    // do sistema — % de duplas com pelo menos um encontro registrado, e %
    // do total de interessados (não batizados) que já têm ao menos um
    // estudo/encontro registrado com alguma dupla.
    function reportFooterStats(){
      const duplasComEncontro = DB.duplas.filter(d => (DB.encontros||[]).some(e=>e.tipo==='dupla' && eqId(e.grupoId, d.id))).length;
      const pctDuplasAtivas = DB.duplas.length ? Math.round(100*duplasComEncontro/DB.duplas.length) : 0;

      const interessados = naoBatizados();
      const idsComEstudo = new Set((DB.frequencia||[]).filter(f=>f.presente).map(f=>sid(f.membroId)));
      const interessadosComEstudo = interessados.filter(m=>idsComEstudo.has(sid(m.id))).length;
      const pctInteressadosComEstudo = interessados.length ? Math.round(100*interessadosComEstudo/interessados.length) : 0;

      return `
        <div class="report-stats">
          <div class="report-stat"><div class="n">${pctDuplasAtivas}%</div><div class="l">das duplas com estudo em andamento</div></div>
          <div class="report-stat"><div class="n">${pctInteressadosComEstudo}%</div><div class="l">dos interessados com ao menos um estudo registrado</div></div>
          <div class="report-stat"><div class="n">${batizados().length}</div><div class="l">batismos no período</div></div>
        </div>`;
    }

    function viewRelatorio(){
      const agora = new Date();
      const geradoEm = fmtDateBR(agora.toISOString().slice(0,10)) + ' às ' + agora.toTimeString().slice(0,5);
      return `
        <div class="section-head report-toolbar">
          <h2>Relatório Missionário Integrado</h2>
          <button class="btn btn-primary" onclick="window.print()">${icon('print',15)} Imprimir / Salvar PDF</button>
        </div>
        <p style="font-size:11px;color:var(--ink-soft);margin-bottom:18px" class="report-only-screen">
          Reúne PGs, Classes Bíblicas, Escola de Evangelismo e Duplas Missionárias num único relatório, com uma grade de presença por pessoa (igual ao modelo em papel) e os percentuais de envolvimento no rodapé.
          Use "Imprimir / Salvar PDF" para gerar um arquivo pronto para compartilhar ou arquivar.
        </p>

        <div class="report-print-head">
          <h1>Relatório Missionário</h1>
          <p>IASD Nova Brasília · gerado em ${geradoEm}</p>
        </div>

        ${reportSection('dupla', DB.duplas)}
        ${reportSection('pg', DB.pgs)}
        ${reportSection('classe', DB.classes)}
        ${reportSection('escola', DB.escolas)}

        ${reportFooterStats()}
      `;
    }

    function registroTopbar(){
      return `
        <div class="topbar">
          <button class="hamburger" onclick="registroBack()">${icon('back',20)}</button>
          <div class="brand-compact"><div class="brand-mark">NB</div><h1>Painel de Registro</h1></div>
        </div>`;
    }

    window.registroBack = function(){
      if(state.registroStage==='panel'){
        state.registroStage = 'group'; state.registroGroupId = null; state.registroPw = null;
        state.registroScoped = null; state.registroEncontros = null; state.registroFrequencia = null;
      } else if(state.registroStage==='auth'){
        state.registroStage = 'group'; state.registroGroupId = null; state.registroPw = null;
      } else if(state.registroStage==='group'){
        state.registroStage = 'role'; state.registroRole = null; state.allPgLocations = null;
      } else {
        state.area = null;
      }
      render();
    };

    function registroBody(){
      if(state.loading) return loadingScreen();
      if(state.registroStage==='role') return registroRoleScreen();
      if(state.registroStage==='group') return registroGroupScreen();
      if(state.registroStage==='auth') return registroAuthScreen();
      return registroPanelScreen();
    }

    function registroRoleScreen(){
      return `
        <div class="hero"><h2>Quem é você?</h2></div>
        <div class="quick-grid">
          <button class="quick-card" onclick="selectRegistroRole('pg')"><div class="ic">${icon('groups',18)}</div><h3>Líder de PG</h3></button>
          <button class="quick-card" onclick="selectRegistroRole('classe')"><div class="ic">${icon('book',18)}</div><h3>Instrutor de Classe Bíblica</h3></button>
          <button class="quick-card" onclick="selectRegistroRole('escola')"><div class="ic">${icon('graduate',18)}</div><h3>Instrutor de Escola de Evangelismo</h3></button>
          <button class="quick-card" onclick="selectRegistroRole('dupla')"><div class="ic">${icon('outreach',18)}</div><h3>Dupla Missionária</h3></button>
        </div>`;
    }
    window.selectRegistroRole = async function(role){
      state.registroRole = role; state.registroStage = 'group';
      if(role==='pg'){
        state.loading = true; render();
        try{ state.allPgLocations = await gsRun('getPgsLocations'); }
        catch(err){ toast('Erro ao carregar mapa: ' + (err && err.message ? err.message : err), true); }
        state.loading = false;
      }
      render();
    };

    function registroGroupScreen(){
      const role = state.registroRole;
      let items = [];
      if(role==='pg') items = DIRECTORY.pgs.map(g=>({id:g.id, label:g.nome, temSenha:g.temSenha}));
      else if(role==='classe') items = DIRECTORY.classes.map(g=>({id:g.id, label:g.nome, temSenha:g.temSenha}));
      else if(role==='escola') items = DIRECTORY.escolas.map(g=>({id:g.id, label:g.nome, temSenha:g.temSenha}));
      else items = DIRECTORY.duplas.map(d=>({id:d.id, label:d.nome1+' & '+d.nome2, temSenha:d.temSenha}));

      const mapBlock = role==='pg' ? `
        <div style="margin:18px 0 6px"><span class="modal-sub-label">MAPA DE TODOS OS PGs</span></div>
        <p class="map-help">Localizações registradas pelos próprios líderes. Toque em um marcador para ver o nome do PG.</p>
        <div id="map-all-pgs" class="map-box" style="margin-bottom:20px"></div>
      ` : '';

      if(items.length===0){
        return `<div class="empty"><h4>Nenhum registro cadastrado ainda.</h4></div>${mapBlock}`;
      }
      return `
        <div class="hero"><h2>Selecione o seu grupo</h2></div>
        <div class="card-grid" style="margin-bottom:6px">
          ${items.map(it=>`
            <button class="quick-card" onclick="selectRegistroGroup('${it.id}')" style="flex-direction:column;align-items:flex-start;gap:5px">
              <h3>${esc(it.label)}</h3>
              ${it.temSenha===false ? `<span class="badge badge-lock-warn">${icon('lock',10)} sem senha ainda</span>` : ''}
            </button>`).join('')}
        </div>
        ${mapBlock}`;
    }

    window.selectRegistroGroup = function(id){
      state.registroGroupId = id;
      state.registroStage = 'auth';
      render();
    };

    function registroAuthScreen(){
      const role = state.registroRole;
      const dir = role==='pg' ? DIRECTORY.pgs : role==='classe' ? DIRECTORY.classes : role==='escola' ? DIRECTORY.escolas : DIRECTORY.duplas;
      const g = dir.find(x=>eqId(x.id, state.registroGroupId));
      const label = role==='dupla' ? (g ? g.nome1+' & '+g.nome2 : '') : (g?g.nome:'');
      return `
        <div class="auth-screen"><div class="auth-card">
          <h2>${esc(label)}</h2>
          <p style="font-size:12px;color:var(--ink-soft);margin:0 0 14px;text-align:center">Digite a senha ${role==='dupla'?'desta dupla':'deste grupo'}, definida pelo coordenador.</p>
          <div class="field"><label>Senha ${role==='dupla'?'da dupla':'do grupo'}</label><input type="password" id="f-group-pw" onkeydown="if(event.key==='Enter')submitRegistroAuth()"></div>
          <button class="btn btn-primary btn-full" onclick="submitRegistroAuth()">Entrar</button>
          <button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="registroBack()">← Voltar</button>
        </div></div>`;
    }

    window.submitRegistroAuth = async function(){
      const pw = document.getElementById('f-group-pw').value;
      if(!pw){ toast('Digite a senha.', true); return; }
      state.loading = true; render();
      try{
        const ok = await gsRun('checkGroupPassword', state.registroRole, state.registroGroupId, pw);
        if(!ok){
          state.loading = false; render();
          toast('Senha incorreta.', true);
          return;
        }
        state.registroPw = pw;
        state.registroScoped = await gsRun('getGroupMembers', state.registroRole, state.registroGroupId, pw);
        state.registroEncontros = await gsRun('getEncontros', state.registroRole, state.registroGroupId, pw);
        state.registroFrequencia = await gsRun('getFrequenciaGrupo', state.registroRole, state.registroGroupId, pw);
        if(state.registroRole==='pg'){ state.allPgLocations = await gsRun('getPgsLocations'); }
        state.registroStage = 'panel';
      }catch(err){ toast('Erro: ' + (err && err.message ? err.message : err), true); }
      state.loading = false; render();
    };

    function registroPanelScreen(){
      return attendanceRegistroPanel();
    }

    // Painel de chamada/registro, reutilizado por Líder de PG, Instrutor de
    // Classe Bíblica, Instrutor de Escola de Evangelismo e Dupla Missionária
    // — todos seguem o mesmo modelo de tabela de frequência. Aqui não é
    // passado o 5º argumento de buildFrequencyTable, então o ícone de
    // observação nunca aparece nesta tela — comportamento intocado.
    function attendanceRegistroPanel(){
      const role = state.registroRole;
      const dir = role==='pg' ? DIRECTORY.pgs : role==='classe' ? DIRECTORY.classes : role==='escola' ? DIRECTORY.escolas : DIRECTORY.duplas;
      const g = dir.find(x=>eqId(x.id, state.registroGroupId));
      const titulo = role==='dupla' ? (g ? g.nome1+' & '+g.nome2 : '') : (g?g.nome:'');
      const membros = state.registroScoped || [];
      const encontros = state.registroEncontros || [];
      const roleLabel = role==='pg' ? 'Membros do PG' : role==='classe' ? 'Alunos da classe' : role==='escola' ? 'Alunos da turma' : 'Interessados vinculados';
      const tituloNovo = role==='dupla' ? 'NOVA VISITA / ESTUDO' : 'NOVA CHAMADA';
      const rotuloBtn = role==='dupla' ? 'Registrar visita' : 'Registrar chamada';
      const rotuloObs = role==='dupla' ? 'Estudo / lição (opcional)' : 'Observações (opcional)';
      const rotuloAdd = role==='dupla' ? 'Adicionar interessado' : 'Adicionar';
      const semPessoasMsg = role==='dupla' ? 'Cadastre ao menos um interessado abaixo para poder registrar a visita.' : 'Cadastre ao menos uma pessoa abaixo para poder fazer a chamada.';

      return `
        <div class="hero"><h2>${esc(titulo)}</h2></div>

        <div class="card" style="margin-bottom:16px">
          <span class="modal-sub-label">${tituloNovo}</span>
          <div class="field" style="margin-top:9px"><label>Data</label><input type="date" id="f-chamada-data" value="${todayStr()}"></div>
          ${membros.length===0 ? `<p style="font-size:11.5px;color:var(--ink-soft);margin-bottom:8px">${semPessoasMsg}</p>` : `
          <div style="margin:8px 0">
            ${membros.map(m=>`
              <div class="checkline" style="margin-bottom:6px">
                <input type="checkbox" id="chk-novo-${m.id}" checked>
                <label for="chk-novo-${m.id}">${esc(m.nome)}</label>
              </div>`).join('')}
          </div>`}
          <div class="field"><label>${rotuloObs}</label><textarea id="f-chamada-obs"></textarea></div>
          <button class="btn btn-primary btn-full" onclick="submitChamada()" ${membros.length===0?'disabled':''}>${rotuloBtn}</button>
        </div>

        <span class="modal-sub-label">FREQUÊNCIA</span>
        <p style="font-size:11px;color:var(--ink-soft);margin:6px 0 8px">Toque na data para ver ou editar o registro daquele dia.</p>
        <div style="margin:0 0 22px">
          ${buildFrequencyTable(membros, encontros, state.registroFrequencia, (encontroId)=>`openEditChamada('${encontroId}')`)}
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 8px">
          <span class="modal-sub-label">${roleLabel.toUpperCase()} (${membros.length})</span>
          <button class="btn btn-primary btn-sm" onclick="openMemberFormRegistro()">${icon('plus',13)} ${rotuloAdd}</button>
        </div>
        <p style="font-size:11px;color:var(--ink-soft);margin-bottom:8px">Aqui você só vê o nome e a situação de cada pessoa. Telefones ficam visíveis apenas ao coordenador.</p>
        ${membros.length===0 ? `<div class="empty"><h4>Ninguém cadastrado ainda.</h4></div>` :
          `<div style="margin-bottom:8px">${membros.map(m=>`
            <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);gap:8px">
              <div style="display:flex;align-items:center;gap:8px">
                <span style="font-size:12.5px;font-weight:600">${esc(m.nome)}</span>
                <span class="badge ${m.batizado?'badge-baptized':'badge-interest'}">${m.batizado?'Batizado':'Interessado'}</span>
              </div>
              <div class="row-actions">
                <button class="icon-btn" onclick="openMemberFormRegistro('${m.id}')">Editar</button>
                <button class="icon-btn" onclick="deleteMemberRegistroConfirm('${m.id}')">Excluir</button>
              </div>
            </div>`).join('')}</div>`}

        ${role==='pg' ? `
        <div style="margin:24px 0 6px"><span class="modal-sub-label">LOCALIZAÇÃO DO SEU PG NO MAPA</span></div>
        <p class="map-help">Arraste o marcador até o local exato de encontro e clique em "Salvar localização". Se o PG for itinerante, volte aqui sempre que o local mudar.</p>
        <div id="map-mine" class="map-box"></div>
        <div style="display:flex;gap:8px;margin:10px 0 10px;flex-wrap:wrap">
          <button class="btn btn-ghost btn-sm" onclick="useMyLocation()">${icon('pin',13)} Usar minha localização atual</button>
          <button class="btn btn-primary btn-sm" onclick="saveMyPgLocation()">Salvar localização</button>
        </div>
        <p class="map-help">O mapa com todos os PGs fica na tela anterior (seleção de grupo).</p>
        ` : ''}
      `;
    }

    window.submitChamada = async function(){
      const data = document.getElementById('f-chamada-data').value.trim();
      if(!data){ toast('Informe a data.', true); return; }
      const observacoes = document.getElementById('f-chamada-obs').value.trim();
      const membros = state.registroScoped || [];
      const presencas = membros.map(m => ({ membroId: m.id, presente: !!(document.getElementById('chk-novo-'+m.id) && document.getElementById('chk-novo-'+m.id).checked) }));
      try{
        await gsRun('registrarChamada', state.registroRole, state.registroGroupId, data, observacoes, presencas, state.registroPw);
        toast('Registrado.');
        state.registroEncontros = await gsRun('getEncontros', state.registroRole, state.registroGroupId, state.registroPw);
        state.registroFrequencia = await gsRun('getFrequenciaGrupo', state.registroRole, state.registroGroupId, state.registroPw);
        render();
      }catch(err){ toast('Erro: ' + (err && err.message ? err.message : err), true); }
    };

    window.removeChamada = async function(id){
      if(!confirm('Excluir este registro?')) return;
      try{
        await gsRun('deleteEncontro', state.registroRole, state.registroGroupId, id, state.registroPw);
        state.registroEncontros = await gsRun('getEncontros', state.registroRole, state.registroGroupId, state.registroPw);
        state.registroFrequencia = await gsRun('getFrequenciaGrupo', state.registroRole, state.registroGroupId, state.registroPw);
        toast('Excluído.');
        render();
      }catch(err){ toast('Erro: ' + (err && err.message ? err.message : err), true); }
    };

    window.openEditChamada = async function(encontroId){
      try{
        const freq = await gsRun('getFrequencia', state.registroRole, state.registroGroupId, encontroId, state.registroPw);
        const freqMap = {};
        freq.forEach(f => { freqMap[String(f.membroId)] = f.presente; });
        const membros = state.registroScoped || [];
        const e = (state.registroEncontros||[]).find(x=>eqId(x.id, encontroId));
        openModal(`
          <h3>${state.registroRole==='dupla'?'Visita':'Chamada'} — ${fmtDateBR(e?e.data:'')}</h3>
          ${membros.length===0 ? '<p style="font-size:12px;color:var(--ink-soft)">Nenhuma pessoa cadastrada.</p>' : `
          <div style="max-height:300px;overflow-y:auto;margin-bottom:8px">
            ${membros.map(m=>`
              <div class="checkline" style="margin-bottom:6px">
                <input type="checkbox" id="chk-edit-${m.id}" ${freqMap[String(m.id)]?'checked':''}>
                <label for="chk-edit-${m.id}">${esc(m.nome)}</label>
              </div>`).join('')}
          </div>`}
          <div class="modal-actions">
            <button class="btn btn-danger-ghost" onclick="closeModal();removeChamada('${encontroId}')">Excluir</button>
            <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
            <button class="btn btn-primary" onclick="saveEditChamada('${encontroId}')">Salvar</button>
          </div>
        `);
      }catch(err){ toast('Erro: ' + (err && err.message ? err.message : err), true); }
    };
    window.saveEditChamada = async function(encontroId){
      const membros = state.registroScoped || [];
      const presencas = membros.map(m => ({ membroId: m.id, presente: !!(document.getElementById('chk-edit-'+m.id) && document.getElementById('chk-edit-'+m.id).checked) }));
      try{
        await gsRun('saveFrequencia', state.registroRole, state.registroGroupId, encontroId, presencas, state.registroPw);
        state.registroFrequencia = await gsRun('getFrequenciaGrupo', state.registroRole, state.registroGroupId, state.registroPw);
        closeModal();
        toast('Atualizado.');
        render();
      }catch(err){ toast('Erro: ' + (err && err.message ? err.message : err), true); }
    };

    window.openMemberFormRegistro = function(memberId){
      const item = memberId ? (state.registroScoped||[]).find(m=>eqId(m.id, memberId)) : null;
      openModal(`
        <h3>${item?'Editar':'Nova pessoa'}</h3>
        <div class="field"><label>Nome completo</label><input type="text" id="f-nome" value="${item?esc(item.nome):''}"></div>
        <div class="field"><label>Telefone${item?' <span style="font-weight:400">(deixe em branco para manter o já salvo)</span>':''}</label><input type="tel" id="f-tel" placeholder="${item?'não será alterado se deixado em branco':'(opcional)'}"></div>
        <div class="field checkline">
          <input type="checkbox" id="f-batizado" ${item&&item.batizado?'checked':''}>
          <label for="f-batizado">Já é batizado(a)</label>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="saveMemberRegistro('${memberId||''}')">Salvar</button>
        </div>
      `);
      document.getElementById('f-nome').focus();
    };

    window.saveMemberRegistro = async function(memberId){
      const nome = document.getElementById('f-nome').value.trim();
      if(!nome){ toast('Informe o nome.', true); return; }
      const telefone = document.getElementById('f-tel').value.trim();
      const batizado = document.getElementById('f-batizado').checked;
      try{
        if(memberId){
          await gsRun('updateMemberRegistro', memberId, state.registroRole, state.registroGroupId, nome, telefone, batizado, state.registroPw);
        } else {
          await gsRun('addMemberRegistro', state.registroRole, state.registroGroupId, nome, telefone, batizado, state.registroPw);
        }
        state.registroScoped = await gsRun('getGroupMembers', state.registroRole, state.registroGroupId, state.registroPw);
        closeModal();
        toast('Salvo.');
        render();
      }catch(err){ toast('Erro: ' + (err && err.message ? err.message : err), true); }
    };

    window.deleteMemberRegistroConfirm = async function(memberId){
      if(!confirm('Excluir esta pessoa?')) return;
      try{
        await gsRun('deleteMemberRegistro', memberId, state.registroRole, state.registroGroupId, state.registroPw);
        state.registroScoped = await gsRun('getGroupMembers', state.registroRole, state.registroGroupId, state.registroPw);
        toast('Excluído.');
        render();
      }catch(err){ toast('Erro: ' + (err && err.message ? err.message : err), true); }
    };

    function initMyPgMap(){
      if(typeof L === 'undefined') return;
      const mineDiv = document.getElementById('map-mine');
      if(!mineDiv || mineDiv._leaflet_id) return;
      const g = DIRECTORY.pgs.find(x=>eqId(x.id, state.registroGroupId));
      const start = (g && g.lat!=null && g.lng!=null) ? [g.lat, g.lng] : MAP_DEFAULT_CENTER;
      const m = L.map(mineDiv).setView(start, (g && g.lat!=null) ? 15 : 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap', maxZoom: 19
      }).addTo(m);
      const marker = L.marker(start, {draggable:true}).addTo(m);
      m.on('click', e => marker.setLatLng(e.latlng));
      window._myPgMarker = marker;
      window._myPgMap = m;
      setTimeout(()=>m.invalidateSize(), 60);
    }

    window.useMyLocation = function(){
      if(!navigator.geolocation){ toast('Geolocalização não é suportada neste navegador.', true); return; }
      navigator.geolocation.getCurrentPosition(pos=>{
        const ll = [pos.coords.latitude, pos.coords.longitude];
        if(window._myPgMarker && window._myPgMap){
          window._myPgMarker.setLatLng(ll);
          window._myPgMap.setView(ll, 16);
        }
      }, () => toast('Não foi possível obter sua localização.', true));
    };

    window.saveMyPgLocation = async function(){
      if(!window._myPgMarker){ toast('O mapa ainda não carregou.', true); return; }
      const ll = window._myPgMarker.getLatLng();
      try{
        await gsRun('updateGroupLocation', 'pg', state.registroGroupId, ll.lat, ll.lng, state.registroPw);
        const g = DIRECTORY.pgs.find(x=>eqId(x.id, state.registroGroupId));
        if(g){ g.lat = ll.lat; g.lng = ll.lng; }
        if(!state.allPgLocations) state.allPgLocations = [];
        const found = state.allPgLocations.find(x=>eqId(x.id, state.registroGroupId));
        if(found){ found.lat = ll.lat; found.lng = ll.lng; }
        else if(g){ state.allPgLocations.push({ id:g.id, nome:g.nome, lider:g.lider, dia:g.dia, local:g.local, lat:ll.lat, lng:ll.lng }); }
        toast('Localização salva.');
      }catch(err){ toast('Erro: ' + (err && err.message ? err.message : err), true); }
    };

    boot();
  })();
  </script>
</body>
</html>
